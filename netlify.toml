[build.environment]
  # These variables hold non-secret configuration (boolean feature flags,
  # numeric limits, public Gemini model names, and a placeholder DATABASE_URL).
  # Their values legitimately appear in source, tests, docs and build output,
  # which trips Netlify secrets scanning. Real secrets (AEGIS_SESSION_SECRET,
  # AEGIS_PII_HMAC_KEY, AEGIS_ADMIN_RESET_SECRET, AEGIS_DIAGNOSTICS_SECRET,
  # CRON_SECRET, GEMINI_API_KEY, UPSTASH_REDIS_REST_TOKEN, ...) remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "AEGIS_E2E_DISABLE_EXTERNAL_AI,AEGIS_ENABLE_DEMO_PERSONA_SWITCH,AEGIS_PRODUCTION_STRICT_READINESS,AEGIS_REQUIRE_DISTRIBUTED_RATE_LIMIT,AEGIS_REQUIRE_EXPLICIT_GEMINI_FALLBACK,AEGIS_REQUIRE_SHARED_PERSISTENCE,AEGIS_REQUIRE_STRICT_GEMINI_QUOTA_SCOPE,AEGIS_REQUIRE_STRICT_SECRETS,TRUST_PROXY_HEADERS,GEMINI_PRIMARY_MODEL,GEMINI_FALLBACK_MODEL,GEMINI_QUOTA_SCOPE_ID,DATABASE_URL,AI_IP_BURST_LIMIT_PER_MIN,AI_OCR_RATE_LIMIT_PER_MIN,AI_RATE_LIMIT_PER_MIN,AI_SANDBOX_RATE_LIMIT_PER_MIN,GEMINI_GLOBAL_OCR_RPM_LIMIT,GEMINI_GLOBAL_RPM_LIMIT,PG_POOL_MAX,NODE_VERSION"
